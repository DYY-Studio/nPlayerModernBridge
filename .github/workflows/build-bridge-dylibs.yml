# Build the seven bridge dylibs and the host assembler from the pinned sources
# in this repository, and publish them together with the reports that verify
# them, so a release asset set can be rebuilt without a local toolchain.
#
# Manual only: the run takes about an hour and its output is a release product.
#
# These dylibs are NOT byte-reproducible, and this workflow does not pretend
# otherwise: `make deps` rebuilds the static closures from scratch, so the
# archives, and the dylibs linked from them, differ on every run
# (dev/acceptance.json, "reproducibility"). The contract for a shipped dylib is
# its verification report, which is why the artifact carries
# build/bridge/<id>-verification.json next to each dylib, and why the hash table
# this run prints is labelled as belonging to that one build.
#
# What is pinned is every input that decides what gets built: the dependency
# locks, the runner image, the Xcode selected below and the iOS SDK it carries,
# uv and Python. PROVENANCE.txt records all of them and ships inside the
# artifact; the SDK is the one that moves the numbers frozen in the manifest's
# `target_abi`, which is why it is selectable and always logged.
name: Build bridge dylibs

on:
  workflow_dispatch:
    inputs:
      xcode:
        description: >-
          Xcode to build against. "default" keeps the runner image's own Xcode;
          otherwise an installed version, e.g. 16.3 or 26.3.
        type: string
        default: default

permissions:
  contents: read

env:
  # The release set (dev/README.md, Release checklist), declared once so the
  # hash step and the upload cannot drift apart. It is checked in both
  # directions: the hash step fails on a listed file that is missing, and the
  # "Check the artifact list covers every dylib built" step fails on a dylib the
  # build produced that nobody listed.
  ARTIFACTS: |-
    build/LibASSBridge.dylib
    build/LibFFmpegFullBridge.dylib
    build/LibFFmpegBridge.dylib
    build/LibFFmpegCoreBridge.dylib
    build/LibFFmpegCore902Bridge.dylib
    build/LibFFmpegOut448Bridge.dylib
    build/LibRendererHighBitBridge.dylib
    libkeystone.dylib

jobs:
  build:
    # arm64 is required, not preferred: deps/ios-arm64.cross and
    # deps/macos-arm64.native drive `xcrun --sdk ...` from the runner image,
    # and tools/keystone.py builds the assembler for this host with
    # -DCMAKE_OSX_ARCHITECTURES=arm64.
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Check out the repository
        # Pinned to a commit SHA, the only immutable reference: a tag can be
        # moved under us. .github/dependabot.yml keeps the pin from going
        # stale. Nothing here pushes, and every source the build fetches comes
        # over plain HTTPS (uv.lock has no git source), so the token does not
        # need to survive into the later steps.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        env:
          REQUESTED: ${{ inputs.xcode }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED" != default ]; then
            selected="/Applications/Xcode_${REQUESTED}.app"
            if [ ! -d "$selected" ]; then
              echo "::error::this runner image has no $selected"
              ls -d /Applications/Xcode*.app
              exit 1
            fi
            sudo xcode-select -s "$selected"
          fi
          # Assignments, not `echo "$(cmd)"`: the status of a command
          # substitution inside an echo is discarded, so a missing SDK would
          # print an empty value and carry on.
          developer_dir=$(xcode-select -p)
          xcode=$(xcodebuild -version)
          xcode_version=$(printf '%s\n' "$xcode" | sed -n '1p')
          xcode_build=$(printf '%s\n' "$xcode" | sed -n '2p')
          sdk_version=$(xcrun --sdk iphoneos --show-sdk-version)
          # `sed` succeeds on empty input, so an unexpected xcodebuild output
          # would leave these empty and the provenance record incomplete
          # instead of failing. The record is built from these values, so
          # assert them here, where failing costs seconds rather than the hour
          # the build takes.
          for value in "$xcode_version" "$xcode_build" "$sdk_version"; do
            [ -n "$value" ] || { echo "::error::the Xcode or SDK version came back empty"; exit 1; }
          done
          echo "developer dir: $developer_dir"
          echo "xcode: $xcode_version"
          echo "xcode build: $xcode_build"
          echo "iphoneos SDK: $sdk_version"
          # Hand the asserted values to the record, rather than looking the same
          # tools up a second time later and hoping for the same answer.
          {
            echo "NPA_XCODE_VERSION=$xcode_version"
            echo "NPA_XCODE_BUILD=$xcode_build"
            echo "NPA_SDK_VERSION=$sdk_version"
          } >> "$GITHUB_ENV"

      - name: Check the host build tools and the runner image
        # meson, ninja and lief come from the dev group below. These two do not
        # come from the project, so require them of the runner image instead of
        # installing them silently.
        run: |
          set -euo pipefail
          command -v pkg-config
          pkg-config --version
          command -v cmake
          cmake --version | head -1
          # ImageOS and ImageVersion identify the runner image, which is what
          # `runs-on: macos-15` pins and the reason a build can be traced at
          # all. Absent means the premise broke, not that the record should
          # print a placeholder, so fail here while it still costs seconds.
          # `${VAR:-}` on purpose: plain $VAR would abort under set -u with a
          # message of its own instead of the one below.
          for value in "${ImageOS:-}" "${ImageVersion:-}"; do
            [ -n "$value" ] || { echo "::error::ImageOS/ImageVersion are unset, so this is not a GitHub-hosted runner image and the image version cannot be recorded"; exit 1; }
          done
          echo "runner image: $ImageOS $ImageVersion"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          # The environment this toolchain was developed on. Left to
          # requires-python, uv would take the runner image's 3.14, which
          # nothing here has been exercised against.
          python-version: "3.12.11"
          enable-cache: "false"

      - name: Build the host assembler
        run: make bootstrap

      - name: Build the dependency closures
        run: make deps

      - name: Build and verify the bridge dylibs
        # Links each dylib and verifies it against its frozen manifest entry,
        # so no separate `make verify` is needed.
        run: make bridge

      - name: Check the artifact list covers every dylib built
        # The hash step catches a listed file that is missing. This catches the
        # other direction: a dylib added to manifests/nplayer-3.13.0.json is
        # built and verified by `make bridge` and then silently not published,
        # because the list above is hand-written. build/ is fresh in CI, so the
        # comparison is exact.
        run: |
          set -euo pipefail
          declared=$(printf '%s\n' $ARTIFACTS | grep '^build/Lib.*\.dylib$' | sed 's|^build/||' | sort)
          built=$(ls -1 build | grep '^Lib.*\.dylib$' | sort)
          if [ "$declared" != "$built" ]; then
            echo "::error::the artifact list and the built dylib set disagree"
            diff <(printf '%s\n' "$declared") <(printf '%s\n' "$built") || true
            exit 1
          fi
          echo "all $(printf '%s\n' "$built" | wc -l | tr -d ' ') built dylibs are declared"

      - name: Run the test suites
        run: |
          set -euo pipefail
          uv run pytest -q
          # dev/tests carries the SDK-drift tripwire: it asserts the Dl_info ABI
          # read from this runner's SDK still equals the manifest's frozen
          # target_abi, and re-checks the built closure is iOS 13 arm64. Its
          # fixtures call pytest.skip() when the SDK or the Keystone library is
          # absent, and a skipped test is a green run, so read the
          # machine-readable report instead of trusting the exit code.
          uv run pytest dev/tests -q --junitxml=build/devtests.xml
          if grep -q 'skipped="[1-9]' build/devtests.xml; then
            echo "::error::a dev test skipped, so the tripwire did not run"
            grep -o 'skipped="[0-9]*"' build/devtests.xml
            exit 1
          fi
          echo "no dev test skipped"

      - name: Record the provenance and this build's hashes
        run: |
          set -euo pipefail
          # The Xcode and SDK values were asserted before the build and reach
          # this step through the environment. The rest are read once, directly,
          # so a failed read aborts the step instead of recording nothing.
          uv_version=$(uv --version)
          python_version=$(uv run python --version)
          macos_version=$(sw_vers -productVersion)
          machine=$(uname -m)
          {
            echo "Build provenance"
            echo "================"
            echo
            echo "commit:       $GITHUB_SHA ($GITHUB_REF_NAME)"
            echo "runner image: $ImageOS $ImageVersion"
            echo "macOS:        $macos_version / $machine"
            echo "xcode:        $NPA_XCODE_VERSION"
            echo "xcode build:  $NPA_XCODE_BUILD"
            echo "iphoneos SDK: $NPA_SDK_VERSION"
            echo "uv:           $uv_version"
            echo "python:       $python_version"
            echo
            echo "Artifacts (sha256)"
            echo "------------------"
            while read -r file; do
              [ -n "$file" ] || continue
              # An assignment takes the pipeline's status, so a missing file
              # ends the step here rather than printing an empty hash.
              digest=$(shasum -a 256 "$file" | cut -d' ' -f1)
              echo "$digest  $(basename "$file")"
            done <<< "$ARTIFACTS"
            echo
            echo "These hashes identify this build only. The dylibs are not"
            echo "byte-reproducible - make deps rebuilds the static closures from"
            echo "scratch - so they differ between runs and must not be compared"
            echo "across them. The contract for a shipped dylib is its own"
            echo "<id>-verification.json, shipped next to it, which records the"
            echo "exports, install name, dependencies, initializers and host paths"
            echo "the manifest freezes. See dev/acceptance.json, \"reproducibility\"."
          } > PROVENANCE.txt
          {
            echo "## Provenance"
            echo
            echo '```'
            cat PROVENANCE.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the dylibs, their reports and the provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-dylibs
          # Every dylib report is written by the verify step inside `make
          # bridge`, which fails the run if one dylib fails its checks, so this
          # glob cannot silently under-match.
          path: |
            ${{ env.ARTIFACTS }}
            build/bridge/*-verification.json
            PROVENANCE.txt
          if-no-files-found: error
          # A re-run of this workflow is a new attempt at the same run, whose
          # previous artifacts still exist, and upload-artifact refuses a name
          # that is already taken. Replace this run's copy instead of failing
          # the re-run over it.
          overwrite: true
